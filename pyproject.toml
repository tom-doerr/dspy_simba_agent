[tool.poetry]
name = "dspy-simba-agent"
version = "0.1.0"
description = "DSPy SIMBA Coding Agent"
authors = ["Your Name <you@example.com>"]
license = "MIT"
packages = [
  { include = "coding_agent" }
]

[tool.poetry.dependencies]
python = "^3.8"
dspy = "*"
datasets = "*"
human-eval = "*"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[tool.poetry.scripts]
coding-agent = "coding_agent.__main__:main_cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
