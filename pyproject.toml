[project]
name = "dspy-simba-agent"
version = "0.1.0"
description = "DSPy SIMBA Coding Agent"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "dspy>=2.5.0",
    "datasets",
    "human-eval",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
coding-agent = "coding_agent.interactive:main"

# Add setuptools config to find the package
[tool.setuptools.packages.find]
where = ["."]  # Look in the root directory
# include = ["coding_agent*"] # Can be more specific if needed

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
